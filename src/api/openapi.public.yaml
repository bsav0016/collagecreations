components:
  schemas:
    AddWhiteRequest:
      type: object
      properties:
        input_image:
          type: string
          format: uri
      required:
      - input_image
    AddWhiteResponse:
      type: object
      properties:
        message:
          type: string
        image:
          type: string
          description: Base64 JPEG.
      required:
      - image
      - message
    AdminLoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    AdminLoginResponse:
      type: object
      properties:
        token:
          type: string
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
      required:
      - is_staff
      - is_superuser
      - token
    AdminMe:
      type: object
      properties:
        username:
          type: string
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
      required:
      - is_staff
      - is_superuser
      - username
    ApplyDiscountRequest:
      type: object
      properties:
        code:
          type: string
        temp_image_id:
          type: string
          format: uuid
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
      required:
      - code
      - order_type
      - temp_image_id
    ApplyDiscountResponse:
      type: object
      properties:
        discount:
          type: number
          format: double
          description: Rate between 0 and 1.
      required:
      - discount
    CartImage:
      type: object
      properties:
        temporary_image_id:
          type: string
          format: uuid
        base_cost:
          type: integer
          description: Unit price in cents.
        watermark_collage:
          type: string
          nullable: true
          description: Base64 JPEG of the watermarked preview.
        expires_at:
          type: string
          format: date-time
      required:
      - base_cost
      - expires_at
      - temporary_image_id
      - watermark_collage
    CatalogItemUpdate:
      type: object
      properties:
        price_cents:
          type: integer
          maximum: 20000
          minimum: 0
        print_material_cost_cents:
          type: integer
          maximum: 6000
          minimum: 0
        active:
          type: boolean
    CatalogItemUpdated:
      type: object
      properties:
        item:
          $ref: '#/components/schemas/PricingCatalogItem'
        changed:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
      - changed
      - item
      - warnings
    ClaimCollageRequest:
      type: object
      properties:
        temporary_image_id:
          type: string
          format: uuid
      required:
      - temporary_image_id
    Constants:
      type: object
      properties:
        AMOUNT_12_12_COLLAGE:
          type: integer
        AMOUNT_12_18_COLLAGE:
          type: integer
        AMOUNT_12_12_REGULAR:
          type: integer
        AMOUNT_12_18_REGULAR:
          type: integer
        AMOUNT_24_24_COLLAGE:
          type: integer
        AMOUNT_24_36_COLLAGE:
          type: integer
        AMOUNT_24_24_REGULAR:
          type: integer
