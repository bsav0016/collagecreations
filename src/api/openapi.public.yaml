openapi: 3.0.3
info:
  title: Collage Creations API
  version: 1.0.0
  description: Backend for the Collage Creations storefront and admin site.
paths:
  /api/add-white/:
    post:
      operationId: addWhite
      summary: Pad an image onto a white canvas for printing
      tags:
      - admin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddWhiteRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddWhiteResponse'
          description: ''
        '400':
          description: The image could not be read.
  /api/admin/me/:
    get:
      operationId: adminMe
      summary: The signed-in staff user and role flags
      tags:
      - admin
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMe'
          description: ''
  /api/admin/orders/{id}/refund/:
    post:
      operationId: refundOrder
      summary: Refund an order through Stripe and record it (superusers); omit the
        amount to refund what is left
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefunded'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Nothing to refund, or more than is refundable.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Order not found.
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stripe could not complete the refund; nothing was recorded.
  /api/admin/pricing/:
    get:
      operationId: getPricing
      description: Everything editable, including costs. Read-only for staff (`can_edit`
        is false).
      summary: Everything editable in pricing, including costs (read-only unless `can_edit`)
      tags:
      - admin
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricingSnapshot'
          description: ''
  /api/admin/pricing/catalog/{id}/:
    put:
      operationId: updateCatalogItem
      summary: Change a print size's price, cost or availability (superusers)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CatalogItemUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CatalogItemUpdate'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItemUpdated'
          description: ''
        '400':
          description: Validation failed. The body maps each field name to a list
            of messages (or has `detail`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/admin/pricing/history/:
    get:
      operationId: getPriceHistory
      summary: The last 100 price and cost changes
      tags:
      - admin
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistory'
          description: ''
  /api/admin/pricing/packages/{id}/:
    put:
      operationId: updateShippingPackage
      summary: Change a shipping package's size, weight or cost (superusers)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingPackageUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShippingPackageUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShippingPackageUpdate'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageUpdated'
          description: ''
        '400':
          description: Validation failed. The body maps each field name to a list
            of messages (or has `detail`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/admin/pricing/settings/:
    put:
      operationId: updateShopSettings
      summary: Change the download price and cost, tax rate and prints per shipment
        (superusers)
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopSettingsUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShopSettingsUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShopSettingsUpdate'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopSettingsUpdated'
          description: ''
        '400':
          description: Validation failed. The body maps each field name to a list
            of messages (or has `detail`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not found.
  /api/apply-discount/:
    post:
      operationId: applyDiscount
      summary: Attach a discount code to the cart; a use is consumed only when payment
        succeeds
      tags:
      - pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDiscountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplyDiscountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyDiscountRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyDiscountResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/claim-collage/:
    post:
      operationId: claimCollage
      description: |-
        Attach a collage to the signed-in customer. Claimed collages are kept for
        CUSTOMER_CART_TTL_DAYS instead of CART_TTL_HOURS, and the order placed from one is linked to
        the customer. The collage's unguessable id is the proof the caller created it.
      summary: Keep a collage in the signed-in customer's account
      tags:
      - customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCollageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClaimCollageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClaimCollageRequest'
        required: true
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartImage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/collage/:
    get:
      operationId: api_collage_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemporaryImageList'
          description: ''
    post:
      operationId: createCollage
      summary: Start building a collage; poll the task id for the result
      tags:
      - collage
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCollageRequest'
        required: true
      security:
      - tokenAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/collage/{id}/:
    get:
      operationId: api_collage_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this temporary image.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryImage'
          description: ''
    put:
      operationId: api_collage_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this temporary image.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemporaryImage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TemporaryImage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TemporaryImage'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryImage'
          description: ''
    patch:
      operationId: api_collage_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this temporary image.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTemporaryImage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTemporaryImage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTemporaryImage'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryImage'
          description: ''
    delete:
      operationId: api_collage_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this temporary image.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/customer/collages/:
    get:
      operationId: customerSavedCollages
      description: |-
        The customer's collages that are still saved (unordered and not expired). No images here:
        a preview can be many megabytes, so the page opens one at a time via claim-collage.
      summary: The customer's saved collages (no images; open one with claim-collage)
      tags:
      - customer
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedCollages'
          description: ''
  /api/customer/collages/{collage_id}/:
    delete:
      operationId: deleteSavedCollage
      summary: Delete one of the customer's saved collages
      parameters:
      - in: path
        name: collage_id
        schema:
          type: string
        required: true
      tags:
      - customer
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/customer/delete-account/:
    post:
      operationId: customerDeleteAccount
      description: |-
        Delete the customer's account and saved collages. The customer must send their email address
        as confirmation. Orders already placed are kept (fulfilment and accounting records) but are no
        longer linked to any account.
      summary: Delete the account and saved collages; orders are kept but unlinked
      tags:
      - customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
        required: true
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/customer/email/request/:
    post:
      operationId: customerEmailRequest
      summary: Email a sign-in code
      tags:
      - customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCodeRequested'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unexpected server error.
  /api/customer/email/verify/:
    post:
      operationId: customerEmailVerify
      summary: Sign in with an emailed code
      tags:
      - customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailCodeVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailCodeVerify'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/customer/export/:
    get:
      operationId: customerExport
      description: Everything we hold about the signed-in customer, as JSON they can
        download.
      summary: Everything held about the signed-in customer, to download
      tags:
      - customer
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerExport'
          description: ''
  /api/customer/google/:
    post:
      operationId: customerGoogleLogin
      summary: Sign in with a Google credential
      tags:
      - customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/customer/me/:
    get:
      operationId: customerMe
      summary: The signed-in customer
      tags:
      - customer
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerIdentity'
          description: ''
  /api/customer/microsoft/:
    post:
      operationId: customerMicrosoftLogin
      summary: Sign in with a Microsoft credential
      tags:
      - customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicrosoftLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MicrosoftLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MicrosoftLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSession'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/customer/orders/:
    get:
      operationId: customerOrders
      summary: The signed-in customer's orders
      tags:
      - customer
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrders'
          description: ''
  /api/customer/orders/{order_id}/reorder/:
    post:
      operationId: reorderOrder
      description: |-
        Start a new saved collage from one of the signed-in customer's past orders, so they can buy
        it again without rebuilding it. Returns the same payload as claim_collage. Repeating the call
        returns the collage already made from that order while it is still saved.
      summary: Start a new cart image from a past order
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - customer
      security:
      - customerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartImage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/customer/unsubscribe/{token}/:
    get:
      operationId: customerUnsubscribe
      description: |-
        Opt a customer out of reminder emails. Reachable straight from the email (GET) and by mail
        clients' one-click unsubscribe (POST); the signed token identifies the customer.
      summary: Opt out of reminder emails (link in the email, and one-click unsubscribe)
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - customer
      security:
      - {}
      responses:
        '200':
          description: A page confirming the opt-out.
        '400':
          description: The link is not valid.
    post:
      operationId: customerUnsubscribeOneClick
      description: |-
        Opt a customer out of reminder emails. Reachable straight from the email (GET) and by mail
        clients' one-click unsubscribe (POST); the signed token identifies the customer.
      summary: Opt out of reminder emails (link in the email, and one-click unsubscribe)
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - customer
      security:
      - {}
      responses:
        '200':
          description: A page confirming the opt-out.
        '400':
          description: The link is not valid.
  /api/discount/:
    get:
      operationId: api_discount_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDiscountCodeList'
          description: ''
    post:
      operationId: api_discount_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiscountCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiscountCode'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCode'
          description: ''
  /api/discount/{id}/:
    get:
      operationId: api_discount_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this discount code.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCode'
          description: ''
    put:
      operationId: api_discount_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this discount code.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscountCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiscountCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiscountCode'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCode'
          description: ''
    patch:
      operationId: api_discount_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this discount code.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDiscountCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDiscountCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDiscountCode'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCode'
          description: ''
    delete:
      operationId: api_discount_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this discount code.
        required: true
      tags:
      - api
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/download/{token}/:
    get:
      operationId: downloadImage
      summary: The purchased image for a download order
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - payment
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: The JPEG file.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid parameters; `error` says what was wrong.
  /api/get-all-orders/:
    get:
      operationId: getAllOrderSummaries
      summary: Every order's id, type, progress flags and status (for the Needs Attention
        list)
      tags:
      - admin
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaries'
          description: ''
        '500':
          content:
